    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px 15px;
            text-align: center;
            background: linear-gradient(135deg, #fff3e0, #ffe0b2);
            color: #5d2906;
        }

        h1 {
            color: #b45309;
            margin-bottom: 10px;
        }

        p {
            font-size: 16px;
        }

        .lantern-container {
            width: 300px;
            height: 300px;
            margin: 70px auto;
            perspective: 1000px;
        }

        .lantern {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: rotateLantern 12s linear infinite;
        }

        .lantern:hover {
            animation-play-state: paused;
        }

        .face {
            position: absolute;
            width: 150px;
            height: 220px;
            left: 75px;
            top: 40px;
            border: 4px solid #b45309;
            border-radius: 10px;
            overflow: hidden;
            background: white;
            box-shadow: 0 5px 15px #0003;
            cursor: pointer;
        }

        .face img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .face:nth-child(1) {
            transform: rotateY(0deg) translateZ(130px);
        }

        .face:nth-child(2) {
            transform: rotateY(60deg) translateZ(130px);
        }

        .face:nth-child(3) {
            transform: rotateY(120deg) translateZ(130px);
        }

        .face:nth-child(4) {
            transform: rotateY(180deg) translateZ(130px);
        }

        .face:nth-child(5) {
            transform: rotateY(240deg) translateZ(130px);
        }

        .face:nth-child(6) {
            transform: rotateY(300deg) translateZ(130px);
        }

        @keyframes rotateLantern {
            from {
                transform: rotateY(0deg);
            }

            to {
                transform: rotateY(360deg);
            }
        }

        .note {
            margin-top: 30px;
            color: #854d0e;
            font-style: italic;
        }

        @media (max-width: 500px) {
            .lantern-container {
                transform: scale(0.8);
                transform-origin: top center;
                margin-bottom: 0;
            }
        }
    </style>
</head>
